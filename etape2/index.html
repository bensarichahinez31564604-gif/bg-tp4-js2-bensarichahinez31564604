<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD-Persons - Etape 2 : Insertion d'une ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">

        <table id="table_persons">
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>
            </thead>
            <tbody id="table_body">
                <tr class="row">
                    <td class="col_number">1</td>
                    <td class="col_text">Nom1</td>
                    <td class="col_text">Prénom1</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox"><input type="checkbox"/></td>
                </tr>
                <tr class="row">
                    <td class="col_number">2</td>
                    <td class="col_text">Nom2</td>
                    <td class="col_text">Prénom2</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox"><input type="checkbox"/></td>
                </tr>
                <tr class="row">
                    <td class="col_number">3</td>
                    <td class="col_text">Nom3</td>
                    <td class="col_text">Prénom3</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox"><input type="checkbox"/></td>
                </tr>
            </tbody>
        </table>

        <!-- Bouton "Ajouter" placé après le tableau, dans le conteneur.
             Au clic (événement onclick), il exécute doInsertRowTable avec des données statiques -->
        <button onclick="doInsertRowTable(99, 'nom', 'prenom', 10)">Ajouter</button>

    </div>

    <!-- Script externe placé à la fin du body  -->
    <script src="script.js"></script>
</body>
</html>
