<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD-Persons - Etape 4 : Espace Résumé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">

        <table id="table_persons">
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>
            </thead>
            <tbody id="table_body"></tbody>
        </table>

        <!-- Espace "Résumé" juste au-dessous du tableau :
             p1 = nombre de lignes, p3 = total des points (p2 sert d'espace central) -->
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Total point(s)= 0</p>
        </div>

        <!-- Le bouton Ajouter appelle maintenant doInsert (qui met aussi à jour le résumé) -->
        <button onclick="doInsert('nom', 'prenom', 10)">Ajouter</button>
        <button onclick="consoleTableau()">Console Tableau</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
